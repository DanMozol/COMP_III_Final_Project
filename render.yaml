services:
  - type: web
    name: audio-spectrum-analyzer
    runtime: python
    rootDir: audio-spectrum-analyzer/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: API_TOKEN
        sync: false
